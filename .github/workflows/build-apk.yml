name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        id: find
        run: |
          if [ -f pubspec.yaml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f pulse_app/pubspec.yaml ]; then
            echo "dir=pulse_app" >> "$GITHUB_OUTPUT"
          else
            echo "pubspec.yaml not found"
            ls -R
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          SRC="${{ steps.find.outputs.dir }}"
          flutter create --project-name pulse_app --org kz.pulse --platforms android "$RUNNER_TEMP/app"
          rm -rf "$RUNNER_TEMP/app/lib" "$RUNNER_TEMP/app/test" "$RUNNER_TEMP/app/analysis_options.yaml"
          cp -r "$SRC/lib" "$RUNNER_TEMP/app/lib"
          cp "$SRC/pubspec.yaml" "$RUNNER_TEMP/app/pubspec.yaml"
          sed -i 's/android:label="[^"]*"/android:label="Pulse"/' "$RUNNER_TEMP/app/android/app/src/main/AndroidManifest.xml"

      - name: Build release APK
        run: |
          cd "$RUNNER_TEMP/app"
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: ${{ runner.temp }}/app/build/app/outputs/flutter-apk/app-release.apk
